<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 08 — else if y switch</title>
</head>
<body>

    <h1>Ejercicio 08 — Estructuras condicionales else if y switch</h1>
    <p>En este ejercicio se trabaja con decisiones múltiples, corrección de errores de sintaxis y comparación entre else if y switch.</p>

    <h2>Parte 1 </h2>
    <script>
        var tareaEntregada = window.prompt("¿Has entregado la tarea? (si/no)");

        if (tareaEntregada === "si") {
            document.write("<p>¡Genial! Puedes relajarte un poco.</p>");
        } else if (tareaEntregada === "no") {
            document.write("<p>Debes ponerte a trabajar para entregarla a tiempo.</p>");
        } else {
            document.write("<p>Por favor responde solo con 'si' o 'no'.</p>");
        }
    </script>

    <h2>Parte 2</h2>
    <script>
        // Ejercicio 1
        let numero = prompt("Ingresa un número:");
        if (numero > 0) { 
            alert("El número es positivo"); 
        } else if (numero < 0) { 
            alert("El número es negativo"); 
        } else { 
            alert("El número es cero"); 
        }
        // Explicación: pide un número, verifica si es positivo, negativo o cero, y muestra un mensaje.

        // Ejercicio 2
        let contraseña = prompt("Ingresa tu contraseña:");
        if (contraseña === "secreto123") { 
            document.write("<p>Contraseña correcta. Bienvenido!</p>"); 
        } else { 
            document.write("<p>Contraseña incorrecta. Inténtalo de nuevo.</p>"); 
        }
        // Explicación: pide la contraseña y verifica si coincide con "secreto123".

        // Ejercicio 3
        let valor = null;
        if (valor === null) { 
            alert("El valor es nulo."); 
        } else { 
            alert("El valor no es nulo."); 
        }
        // Explicación: la variable empieza como null, así que entra en el bloque de valor nulo.

        // Ejercicio 4
        let num = parseInt(prompt("Ingresa un número:"));
        if (num > 0 && num % 2 === 0) { 
            console.log("El número es positivo y par"); 
        } else if (num > 0 && num % 2 !== 0) { 
            console.log("El número es positivo e impar"); 
        } else { 
            console.log("El número no es positivo"); 
        }
        // Explicación: pide un número, distingue entre positivo par, positivo impar y otros casos.
    </script>

    <h2>Parte 3</h2>
    <script>
        var topping = window.prompt("Qué topping quieres: oreo, kitkat, brownie, lacasitos u otro");
        var helado = 1.90;
        var precio = 0;
        var precioFinal = 0;

        if (topping === "oreo") {
            precio = 1;
        } else if (topping === "kitkat") {
            precio = 1.50;
        } else if (topping === "brownie") {
            precio = 0.75;
        } else if (topping === "lacasitos") {
            precio = 0.95;
        } else {
            document.write("<p>No tenemos este topping, lo sentimos.</p>");
        }

        precioFinal = helado + precio;
        document.write("<p>El helado cuesta " + precioFinal + " €</p>");
    </script>

    <h2>Parte 4</h2>
    <script>
        var topping2 = window.prompt("Elige tu topping de nuevo: oreo, kitkat, brownie, lacasitos u otro");
        var helado2 = 1.90;
        var precio2 = 0;
        var precioFinal2 = 0;

        switch (topping2) {
            case "oreo":
                precio2 = 1;
                break;
            case "kitkat":
                precio2 = 1.50;
                break;
            case "brownie":
                precio2 = 0.75;
                break;
            case "lacasitos":
                precio2 = 0.95;
                break;
            default:
                document.write("<p>No tenemos este topping, lo sentimos.</p>");
        }

        precioFinal2 = helado2 + precio2;
        document.write("<p>El helado cuesta " + precioFinal2 + " €</p>");
    </script>

</body>
</html>
