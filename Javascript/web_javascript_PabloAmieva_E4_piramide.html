<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cálculo de Volumen - Pirámide</title>
</head>
<body>
    <h1>Cálculo de Volumen de una Pirámide</h1>

    <script>
        let areaBase = parseFloat(prompt("Ingrese el valor del área de la base de la pirámide (en unidades cuadradas):"));
        let altura = parseFloat(prompt("Ingrese el valor de la altura de la pirámide (en unidades):"));
        
        if (areaBase > 0 && altura > 0) {
            let volumen = (areaBase * altura) / 3;
            document.write("El volumen de la pirámide es: " + volumen + " unidades cúbicas.");
        } else {
            document.write("Por favor, ingrese valores válidos.");
        }
    </script>
</body>
</html>
