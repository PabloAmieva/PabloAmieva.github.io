<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Área del Círculo</title>
</head>
<body>

    <h2>Calcular Área del Círculo</h2>

    <label>Radio:</label>
    <input type="number" id="radio">
    <button onclick="calcular()">Calcular</button>

    <h3 id="resultado"></h3>

    <script>
        function calcular() {
            let radio = parseFloat(document.getElementById("radio").value);
            let area = Math.PI * radio * radio;
            document.getElementById("resultado").innerHTML =
                "El área es: " + area.toFixed(2);
        }
    </script>

</body>
</html>
