<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Examen de Conducir - Apto o No Apto</title>
</head>
<body>
    <h1>Resultado del Examen de Conducir</h1>

    <script>
        let fallos = parseInt(prompt("¿Cuántas respuestas incorrectas tuviste en el examen (de 30 preguntas)?"));
        
        if (fallos > 3) {
            alert("No Apto");
        } else {
            alert("Apto");
        }
    </script>
</body>
</html>
