<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Área del Cuadrado</title>
</head>
<body>

    <h2>Calcular Área del Cuadrado</h2>

    <label>Lado:</label>
    <input type="number" id="lado">
    <button onclick="calcular()">Calcular</button>

    <h3 id="resultado"></h3>

    <script>
        function calcular() {
            let lado = parseFloat(document.getElementById("lado").value);
            let area = lado * lado;
            document.getElementById("resultado").innerHTML =
                "El área es: " + area;
        }
    </script>

</body>
</html>
